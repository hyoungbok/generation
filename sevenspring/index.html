<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SevenSprings</title>
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const text = document.querySelectorAll('.main img');

			text.forEach((img) => {			

				// 2. 애니메이션 시작 위치 설정
				img.style.opacity = "0";
				img.style.top = "-200px";  // 위쪽 바깥에서 시작
				img.style.left = "300px";

				// [핵심] 브라우저가 현재 설정한 시작 위치(-200px)를 즉시 인식하도록 강제합니다.
				img.offsetHeight;

				// 3. 목적지 설정 (CSS transition 덕분에 부드럽게 내려옵니다)
				img.style.opacity = "1";
				img.style.top = "100px";   // 아래로 내려옴
				img.style.left = "300px";
			});
		});
	</script>
</head>

<body class="home">
	<div class="main">
		<img src="img/text_spring.png" alt="봄식탁">
		<div><a href="sevensprings.html">HOME</a></div>
	</div>
</body>

</html>
