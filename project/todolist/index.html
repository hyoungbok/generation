<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Todo List</title>	
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<script src="js/script.js"></script>
</head>
<body>
	<div class="todo_wrap">
		<div class="todo_list">
			<h1>Todo List</h1>
			<div class="stat_container">
				<div class="details">
					<h2>진행중!</h2>
					<div class="progressbar">
						<div class="progress"></div>
					</div>
				</div>
				<div class="stats_number">
					<p class="numbers">0 / 0</p>
				</div>
			</div>
			<form class="input_area">
				<input type="text" class="task_input" placeholder="오늘 할일 입력하세요.">
				<button type="submit" class="add_btn"><i class="ri-add-line"></i></button>
			</form>
			<div class="todo_container">
				<ul class="task_list"></ul>
				<img src="img/todo_img.png" alt class="empty_img">
			</div>
		</div>
	</div>
</body>
</html>
